<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa conceptual · Operaciones</title>
<style>
:root{--f:'Aptos Narrow','Aptos','Arial Narrow','Roboto Condensed',sans-serif-condensed,sans-serif;--ink:#12304f}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;font-family:var(--f);color:var(--ink)}
/* fondo mesh gradient */
#mesh{position:fixed;inset:0;overflow:hidden;background:#e4f5ff}
#mesh i{position:absolute;border-radius:50%;filter:blur(90px);animation:mv 20s ease-in-out infinite alternate}
#mesh i:nth-child(1){width:60vw;height:60vw;left:-10vw;top:-15vw;background:#6ec6ff}
#mesh i:nth-child(2){width:50vw;height:50vw;right:-10vw;top:5vh;background:#bfe8ff;animation-delay:-5s}
#mesh i:nth-child(3){width:55vw;height:55vw;left:25vw;bottom:-25vw;background:#4fb3f6;animation-delay:-9s}
#mesh i:nth-child(4){width:40vw;height:40vw;left:10vw;top:30vh;background:#fff;animation-delay:-13s}
#mesh i:nth-child(5){width:45vw;height:45vw;right:5vw;bottom:-10vw;background:#fff;animation-delay:-3s}
@keyframes mv{to{transform:translate(12vw,-8vh) scale(1.25)}}
#net{position:fixed;inset:0}
#view{position:fixed;inset:0 0 64px 0;overflow:hidden;cursor:grab;touch-action:none}
#stage{position:absolute;left:0;top:0;width:2800px;height:1950px;transform-origin:0 0;transition:transform 1.3s cubic-bezier(.6,0,.2,1)}
#stage.d{transition:none}
#ln{position:absolute;inset:0;width:2800px;height:1950px}
#ln path{fill:none;stroke-width:9;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.1s ease}
#ln path.on{stroke-dashoffset:0}
.n{position:absolute;translate:-50% -50%;transform:scale(0);transition:transform .8s cubic-bezier(.3,1.6,.5,1);z-index:2;cursor:pointer}
.n.on{transform:scale(1)}.n.on:hover{transform:scale(1.05)}
.w{position:relative;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;text-align:center;
 background:var(--bg);color:var(--tx);border:6px solid var(--bd);box-shadow:8px 10px 0 var(--sh);animation:bob 6s ease-in-out infinite;animation-delay:var(--d)}
@keyframes bob{50%{transform:translateY(-12px)}}
.in{padding:0 12%;font-size:30px;line-height:1.15}
.in b{display:block;font-size:1.35em;color:var(--ti);line-height:1.05;margin-bottom:.2em}
.x{display:none}.alt .m{display:none}.alt .x{display:block}
.hx::after{content:"✨";position:absolute;left:0;right:0;bottom:7%;font-size:24px}
.hx.alt::after{content:"↩"}
.ce{--bg:#fff;--tx:var(--ink);--ti:var(--ink);--bd:var(--ink);--sh:#7db6e0}
.lr{--bg:#141414;--tx:#f6e7b4;--ti:#e5b83c;--bd:#d4a62a;--sh:#8a6d17}
.ba{--bg:#fff;--tx:#123a7a;--ti:#1f5fbf;--bd:#1f5fbf;--sh:#7fa6dd}
.cr{--bg:#2f9e44;--tx:#fff;--ti:#ffe14a;--bd:#111;--sh:#111}
.hub b{font-size:1.9em}.ce b{font-size:1.8em}
.lg{display:block;height:90px;max-width:70%;margin:0 auto 8px;object-fit:contain;background:#fff;border-radius:16px;padding:6px}
.em{font-size:70px;line-height:1.1}
.ar{position:absolute;translate:-50% -50%;z-index:6;border:4px solid var(--ink);background:#ffe86b;border-radius:99px;padding:12px 34px;font:700 42px var(--f);color:var(--ink);cursor:pointer;white-space:nowrap;animation:pl 1.3s ease-in-out infinite;box-shadow:5px 6px 0 var(--ink)}
.ar:hover{background:#fff}.ar span{display:inline-block;margin-left:12px;font-size:1.3em;line-height:1}
@keyframes pl{50%{scale:1.1}}
#bar{position:fixed;bottom:0;left:0;right:0;height:64px;display:flex;gap:10px;align-items:center;justify-content:center;background:#fff;border-top:4px solid var(--ink);z-index:9;font-size:20px}
button{font:inherit;border:3px solid var(--ink);border-radius:99px;padding:3px 18px;background:#ffe86b;color:var(--ink);cursor:pointer}
button:hover{background:#fff}button:focus-visible{outline:3px solid #1f5fbf}
#lbl{min-width:200px;text-align:center}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="mesh"><i></i><i></i><i></i><i></i><i></i></div>
<canvas id="net"></canvas>
<div id="view"><div id="stage"><svg id="ln" viewBox="0 0 2800 1950"></svg></div></div>
<div id="bar"><button id="prev">◀ Atrás</button><span id="lbl"></span><button id="next">Siguiente ▶</button><button id="all">🔭 Ver todo</button><button id="rst">↺ Reiniciar</button></div>
<script>
const col={ce:'#12304f',lr:'#d4a62a',ba:'#0b3d91',cr:'#111'};
const logo=(f,e)=>`<img class="lg" src="logos/${f}.png" alt="" onerror="this.outerHTML='<div class=em>${e}</div>'">`;
// id, padre, x, y, ancho, clase, texto de la flecha, contenido
const D=[
["cen",null,1400,850,340,"ce","","<b>⚙️ Operaciones</b>3 empresas"],
["h1","cen",650,850,300,"lr hub","Le Roma",logo("leroma","🍨")+"<b>Le Roma</b>Helados"],
["a1","h1",230,360,380,"lr","Demanda","<b>El clima manda</b><span class=m>Verano: +330 baldes por día. Invierno: 150–180.</span><span class=x>Se revisa cada lunes. Un sabor “vence” al mes: prima la frescura.</span>"],
["b1","h1",230,1340,380,"lr","Personal","<b>Estrategia mixta</b><span class=m>17 empleados, 22 en verano.</span><span class=x>Vacaciones en invierno. Evalúan 2 turnos para el verano 2027.</span>"],
["h2","cen",1400,1340,300,"ba hub","Bálsamo",logo("balsamo","🔧")+"<b>Bálsamo</b>Autopartes"],
["a2","h2",800,1700,380,"ba","Demanda","<b>No todo rota igual</b><span class=m>Algunos repuestos salen todos los días, otros casi nunca.</span><span class=x>Son especialistas, no multimarca. InfoBal 10 indica qué repuesto sirve a qué modelo.</span>"],
["b2","h2",2000,1700,380,"ba","Personal","<b>Depósito eficiente</b><span class=m>Lo más pedido queda a mano. Tareas priorizadas de hoy a 60 días.</span><span class=x>Tres máquinas de envasado. Más productividad sin sumar gente.</span>"],
["h3","cen",2150,850,300,"cr hub","CREA",logo("crea","🌱")+"<b>CREA</b>Red agro"],
["a3","h3",2570,360,380,"cr","Demanda","<b>Anticipar necesidades</b><span class=m>Conecta productores con startups. Estudio de mercado y juicio de expertos.</span><span class=x>Método no confirmado: es nuestra interpretación.</span>"],
["b3","h3",2570,1340,380,"cr","Personal","<b>Estrategia de nivel</b><span class=m>Estructura estable, sin contratar o despedir según la demanda.</span><span class=x>Los asesores los paga cada grupo, no AACREA.</span>"]
];
const order=D.map(d=>d[0]),N={};
const stage=document.getElementById('stage'),view=document.getElementById('view'),ln=document.getElementById('ln');
D.forEach(([id,par,x,y,w,cls,lab,html],i)=>{
 const el=document.createElement('div'),c=cls.split(' ');el.className='n '+cls;
 el.style.cssText=`left:${x}px;top:${y}px;width:${w}px;--d:-${i*.7}s`;
 const hx=html.includes('class=x');
 el.innerHTML=`<div class="w${hx?' hx':''}"><div class="in">${html}</div></div>`;
 const w0=el.querySelector('.w');
 el.onclick=()=>{if(hx){w0.classList.toggle('alt');el.classList.toggle('alt')}};
 stage.appendChild(el);N[id]={id,par,x,y,cls:c[0],lab,el,open:false,ar:null};
});
const kids=id=>D.filter(d=>d[1]==id).map(d=>d[0]);
function open(id){const n=N[id];if(n.open)return;
 if(n.par)open(n.par);
 n.open=true;n.el.classList.add('on');
 if(n.ar){n.ar.remove();n.ar=null}
 if(n.par){const p=N[n.par],mx=(p.x+n.x)/2,my=(p.y+n.y)/2,dx=n.x-p.x,dy=n.y-p.y,L=Math.hypot(dx,dy);
  const path=document.createElementNS('http://www.w3.org/2000/svg','path');
  path.setAttribute('d',`M${p.x} ${p.y} Q${mx-dy/L*60} ${my+dx/L*60} ${n.x} ${n.y}`);
  path.setAttribute('pathLength',1);path.setAttribute('stroke',col[n.cls]);ln.appendChild(path);
  requestAnimationFrame(()=>requestAnimationFrame(()=>path.classList.add('on')))}
 kids(id).forEach(k=>{const c=N[k];if(c.open||c.ar)return;
  const dx=c.x-n.x,dy=c.y-n.y,L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L,r=n.el.offsetWidth/2;
  const e=r+20+145*Math.abs(ux)+42*Math.abs(uy);
  const b=document.createElement('button');b.className='ar';b.style.left=n.x+ux*e+'px';b.style.top=n.y+uy*e+'px';
  b.innerHTML=`${c.lab}<span style="transform:rotate(${Math.atan2(dy,dx)*180/Math.PI}deg)">➜</span>`;
  b.onclick=ev=>{ev.stopPropagation();cur=order.indexOf(k);open(k);fly(k);lbl()};
  stage.appendChild(b);c.ar=b});}
let cam={x:1400,y:850,s:1},cur=0;
const vh=()=>view.clientHeight;
function apply(){stage.style.transform=`translate(${innerWidth/2-cam.x*cam.s}px,${vh()/2-cam.y*cam.s}px) scale(${cam.s})`}
function fly(id){const n=N[id],p=n.par?N[n.par]:null;
 cam={x:n.x+(p?(p.x-n.x)*.3:0),y:n.y+(p?(p.y-n.y)*.3:0),s:Math.min(innerWidth/1250,vh()/820)};apply()}
function overview(){cam={x:1400,y:975,s:Math.min(innerWidth/2800,vh()/1950)*.97};apply()}
function lbl(){document.getElementById('lbl').textContent=`Paso ${cur+1} de ${order.length}`}
function go(i){cur=Math.max(0,Math.min(order.length-1,i));open(order[cur]);fly(order[cur]);lbl()}
function reset(){ln.innerHTML='';D.forEach(d=>{const n=N[d[0]];n.open=false;n.el.classList.remove('on','alt');n.el.querySelector('.w').classList.remove('alt');if(n.ar){n.ar.remove();n.ar=null}});go(0)}
next.onclick=()=>go(cur+1);prev.onclick=()=>go(cur-1);all.onclick=overview;rst.onclick=reset;
addEventListener('keydown',e=>{if(e.key=='ArrowRight'||e.key==' '){e.preventDefault();go(cur+1)}if(e.key=='ArrowLeft')go(cur-1);if(e.key=='a')overview()});
// arrastrar y zoom
let dg=null;
view.addEventListener('pointerdown',e=>{if(e.target.closest('.n,.ar'))return;dg=[e.clientX,e.clientY];stage.classList.add('d');view.style.cursor='grabbing'});
addEventListener('pointermove',e=>{if(!dg)return;cam.x-=(e.clientX-dg[0])/cam.s;cam.y-=(e.clientY-dg[1])/cam.s;dg=[e.clientX,e.clientY];apply()});
addEventListener('pointerup',()=>{dg=null;stage.classList.remove('d');view.style.cursor='grab'});
let tm;view.addEventListener('wheel',e=>{e.preventDefault();stage.classList.add('d');cam.s=Math.max(.12,Math.min(2.5,cam.s*Math.exp(-e.deltaY*.001)));apply();clearTimeout(tm);tm=setTimeout(()=>stage.classList.remove('d'),200)},{passive:false});
addEventListener('resize',apply);
// red de nodos animada (reacciona al mouse)
const cv=document.getElementById('net'),cx=cv.getContext('2d');let W,H,mx=-999,my=-999;
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight}rs();addEventListener('resize',rs);
addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY});
const P=Array.from({length:90},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,vx:(Math.random()-.5)*.7,vy:(Math.random()-.5)*.7,r:2+Math.random()*3}));
function loop(){cx.clearRect(0,0,W,H);
 P.forEach((p,i)=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;
  cx.fillStyle='rgba(25,110,190,.55)';cx.beginPath();cx.arc(p.x,p.y,p.r,0,7);cx.fill();
  for(let j=i+1;j<P.length;j++){const q=P[j],d=Math.hypot(p.x-q.x,p.y-q.y);
   if(d<170){cx.strokeStyle=`rgba(25,110,190,${.4*(1-d/170)})`;cx.lineWidth=1.5;cx.beginPath();cx.moveTo(p.x,p.y);cx.lineTo(q.x,q.y);cx.stroke()}}
  const m=Math.hypot(p.x-mx,p.y-my);if(m<220){cx.strokeStyle=`rgba(255,255,255,${.9*(1-m/220)})`;cx.lineWidth=2;cx.beginPath();cx.moveTo(p.x,p.y);cx.lineTo(mx,my);cx.stroke()}});
 requestAnimationFrame(loop)}
loop();
go(0);
</script>
</body>
</html>
