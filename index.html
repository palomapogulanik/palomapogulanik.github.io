<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa conceptual · Gestión de Operaciones</title>
<style>
:root{--f:'Aptos Narrow','Aptos','Arial Narrow','Roboto Condensed',sans-serif-condensed,sans-serif;--cy:#29c4ff}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;font-family:var(--f);color:#e8f0ff;background:#04060f}
#mesh{position:fixed;inset:0;overflow:hidden;background:radial-gradient(ellipse at 50% 45%,#0b2a5c 0,#050a1a 55%,#03050d 100%)}
#mesh i{position:absolute;border-radius:50%;filter:blur(100px);opacity:.45;animation:mv 22s ease-in-out infinite alternate}
#mesh i:nth-child(1){width:50vw;height:50vw;left:-10vw;top:-10vw;background:#3a1fa0}
#mesh i:nth-child(2){width:45vw;height:45vw;right:-8vw;top:10vh;background:#0a7a9e;animation-delay:-6s}
#mesh i:nth-child(3){width:45vw;height:45vw;left:28vw;bottom:-20vw;background:#b4590a;animation-delay:-11s}
@keyframes mv{to{transform:translate(10vw,-6vh) scale(1.25)}}
#net{position:fixed;inset:0}
#top{position:fixed;left:16px;top:12px;z-index:8;background:#0a1226cc;border:1px solid #29c4ff66;border-radius:14px;padding:6px 16px;font-size:20px;line-height:1.15;backdrop-filter:blur(6px)}
#top b{font-size:1.2em;color:#ffc94d}
#view{position:fixed;inset:0 0 64px 0;overflow:hidden;cursor:grab;touch-action:none}
#stage{position:absolute;left:0;top:0;width:3400px;height:2100px;transform-origin:0 0;transition:transform 1.3s cubic-bezier(.6,0,.2,1)}
#stage.d{transition:none}
#ln{position:absolute;inset:0;width:3400px;height:2100px;overflow:visible}
#ln path{fill:none;stroke-width:4;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.1s ease;filter:drop-shadow(0 0 6px currentColor)}
#ln path.on{stroke-dashoffset:0}
#ln path.orb{stroke:rgba(140,200,255,.2);stroke-width:2;stroke-dasharray:10 12;stroke-dashoffset:0;filter:none;transition:stroke .9s,stroke-width .9s}
#ln path.orb.l.lit{stroke:#9b7bff;stroke-width:3}
#ln path.orb.r.lit{stroke:#2de2c4;stroke-width:3}
.n{position:absolute;translate:-50% -50%;transform:scale(0);transition:transform .9s cubic-bezier(.3,1.5,.5,1);z-index:2;cursor:pointer}
.n.on{transform:scale(1)}.n.on:hover{transform:scale(1.06)}
.w{position:relative;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;text-align:center;
 background:radial-gradient(circle at 32% 26%,var(--g1) 0,var(--g2) 48%,var(--g3) 100%);color:var(--tx);
 box-shadow:0 0 0 4px var(--r1),0 0 60px var(--glow),inset -16px -20px 40px #0007;animation:bob 7s ease-in-out infinite;animation-delay:var(--d)}
.cr .w{box-shadow:0 0 0 5px #111,0 0 0 10px #ffe14a,0 0 60px var(--glow),inset -16px -20px 40px #0007}
.sun .w{animation:bob 7s ease-in-out infinite,sp 4s ease-in-out infinite;box-shadow:0 0 0 6px #ffe9a8aa,0 0 140px #ffb02e,inset -22px -28px 60px #b3410088}
@keyframes bob{50%{transform:translateY(-14px)}}
@keyframes sp{50%{box-shadow:0 0 0 10px #ffe9a866,0 0 230px #ffb02e,inset -22px -28px 60px #b3410088}}
.in{padding:0 8%;font-size:24px;line-height:1.1}
.sun .in{font-size:52px;font-weight:700;line-height:1;padding:0 12%}
.sat .in{font-size:84px;line-height:1}
.lab{position:absolute;left:50%;top:calc(100% + 18px);translate:-50% 0;width:440px;max-width:440px;text-align:center;color:#fff;line-height:1.2;pointer-events:none;overflow-wrap:break-word}
.lab .c{display:block;color:var(--ac);font-size:24px;font-weight:700}
.lab b{display:block;font-size:34px;margin:2px 0 4px}
.lab .s{display:block;color:#d1dcf4;font-size:22px;max-width:100%;text-wrap:pretty}
.lab i{display:block;font-style:normal;color:var(--cy);font-size:20px;margin-top:4px}
.sun{--g1:#fff6b8;--g2:#ffc933;--g3:#e8530e;--tx:#4a1d00;--ac:#ffc94d;--hd:#b3410e;--ht:#fff}
.s1{--g1:#e3d6ff;--g2:#8a6bff;--g3:#3a1fa0;--glow:#9b7bffcc;--r1:#9b7bff;--tx:#fff;--ac:#c9b6ff;--hd:#3a1fa0;--ht:#fff}
.s2{--g1:#c4fff3;--g2:#2de2c4;--g3:#0a6b60;--glow:#2de2c4cc;--r1:#2de2c4;--tx:#fff;--ac:#7ff5df;--hd:#0a6b60;--ht:#fff}
.lr{--g1:#6b5a2a;--g2:#151515;--g3:#000;--glow:#e5b83c88;--r1:#d4a62a;--tx:#f0dc9a;--ac:#e5b83c;--hd:#141414;--ht:#e5b83c}
.ba{--g1:#fff;--g2:#d6e4ff;--g3:#5d86d8;--glow:#5b8cffaa;--r1:#1f5fbf;--tx:#123a7a;--ac:#8fb5ff;--hd:#1f5fbf;--ht:#fff}
.cr{--g1:#9af5ae;--g2:#2f9e44;--g3:#0c4d1d;--glow:#3fd66baa;--r1:#ffe14a;--tx:#fff;--ac:#ffe14a;--hd:#2f9e44;--ht:#ffe14a}
.lg{display:block;width:80%;height:auto;margin:0 auto;border-radius:10px}
.ar{position:absolute;translate:-50% -50%;z-index:6;border:3px solid var(--cy);background:#07142bdd;border-radius:99px;padding:12px 34px;font:700 42px var(--f);color:#fff;cursor:pointer;white-space:nowrap;animation:pl 1.3s ease-in-out infinite;box-shadow:0 0 28px #29c4ff99}
.ar:hover{background:#0f3d8f}.ar span{display:inline-block;margin-left:12px;font-size:1.3em;line-height:1;color:var(--cy)}
@keyframes pl{50%{scale:1.1}}
#pn{display:none!important;position:fixed;right:0;top:0;bottom:64px;width:min(520px,92vw);z-index:10;background:#0a1124f2;color:#dbe6ff;border-left:4px solid var(--ac,#29c4ff);transform:translateX(105%);transition:transform .5s cubic-bezier(.3,.9,.3,1);display:flex;flex-direction:column;box-shadow:-10px 0 40px #000a}
#pn.on{transform:none}
.ph{display:flex;align-items:center;gap:14px;padding:16px 18px;background:var(--hd);color:var(--ht)}
.ph img{width:150px;border-radius:10px}
.ph h2{font-size:34px;line-height:1;flex:1}
.ph button{background:#fff;border-color:#fff;color:#12304f;font-size:26px;padding:0 14px}
.pb{overflow:auto;padding:16px 22px 28px;font-size:22px;line-height:1.3}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{background:#12203f;border:2px solid var(--ac);color:#cfe3ff;border-radius:99px;padding:1px 14px;font-size:19px}
.pb section{border-left:5px solid var(--ac);padding:2px 0 2px 14px;margin:0 0 14px}
.pb h3{font-size:25px;color:#fff;margin-bottom:2px}
#bar{position:fixed;bottom:0;left:0;right:0;height:64px;display:flex;gap:10px;align-items:center;justify-content:center;background:#070b18ee;border-top:2px solid #29c4ff55;z-index:11;font-size:20px;color:#cfe3ff}
button{font:inherit;border:2px solid var(--cy);border-radius:99px;padding:3px 18px;background:transparent;color:#cfe3ff;cursor:pointer}
button:hover{background:#29c4ff33}button:focus-visible{outline:3px solid #fff}
#lbl{min-width:200px;text-align:center}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="mesh"><i></i><i></i><i></i></div>
<canvas id="net"></canvas>
<div id="top"><b>Gestión de Operaciones</b><br>Previsión de la demanda · Planificación agregada y PMP · Le Roma, Bálsamo y CREA</div>
<div id="view"><div id="stage"><svg id="ln" viewBox="0 0 3400 2100"></svg></div></div>
<aside id="pn"><div class="ph"><img id="pl" alt=""><h2 id="pt"></h2><button id="px" aria-label="Cerrar">✕</button></div><div class="pb" id="pb"></div></aside>
<div id="bar"><button id="prev">◀ Atrás</button><span id="lbl"></span><button id="next">Siguiente ▶</button><button id="all">🔭 Ver todo</button><button id="rst">↺ Reiniciar</button></div>
